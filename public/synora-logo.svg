<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="synoraBgGrad2" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="45%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="synoraPulseGrad2" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="synoraGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Rounded Shield Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#synoraBgGrad2)"/>
  
  <!-- Subtle Inner Glass Accent -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5"/>

  <!-- Medical Cross Ambient Silhouette -->
  <path d="M32 14v36M14 32h36" stroke="rgba(255, 255, 255, 0.22)" stroke-width="6" stroke-linecap="round"/>

  <!-- Dynamic ECG Heartbeat & AI Pulse Wave -->
  <path d="M11 32h11l3.5-9 6.5 18 5.5-12 3 3h12.5" 
        stroke="url(#synoraPulseGrad2)" 
        stroke-width="3.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#synoraGlow2)"/>

  <!-- AI Intelligence Sparkle (Top-Right) -->
  <path d="M48 13c0 3.5 2.2 5.5 5.5 5.5-3.3 0-5.5 2-5.5 5.5 0-3.5-2.2-5.5-5.5-5.5 3.3 0 5.5-2 5.5-5.5z" fill="#FFFFFF"/>
  
  <!-- Small Vitality Dot -->
  <circle cx="18" cy="46" r="2.2" fill="#FFFFFF" opacity="0.85"/>
</svg>
